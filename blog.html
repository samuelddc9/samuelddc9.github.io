<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog - Team Tap Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<header>
  <div class="logo">
    <a href="index.html"><img src="images/teamtap.png" alt="Team Tap Games Logo"></a>
  </div>
  <nav>
    <ul>
      <li><a href="index.html#about">About Us</a></li>
      <li><a href="index.html#games">Games</a></li>
      <li><a href="index.html#apps">Apps</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>
</header>

<div class="spacer"></div>

<section class="blog-hero">
  <div class="blog-hero-content">
    <h1>Team Tap Games Blog</h1>
    <p>Latest news, updates, and insights from our game development journey</p>
  </div>
</section>

<section id="blog">
  <div class="blog-filter-container">
    <button class="filter-btn active" data-filter="all" onclick="filterBlogPosts('all')">All</button>
    <button class="filter-btn" data-filter="development" onclick="filterBlogPosts('development')">Development</button>
    <button class="filter-btn" data-filter="announcements" onclick="filterBlogPosts('announcements')">Announcements</button>
    <button class="filter-btn" data-filter="updates" onclick="filterBlogPosts('updates')">Updates</button>
    <button class="filter-btn" data-filter="behind-the-scenes" onclick="filterBlogPosts('behind-the-scenes')">Behind the Scenes</button>
  </div>

  <div class="blog-posts" id="blogPostsContainer">
    <!-- Blog posts will be dynamically loaded here -->
  </div>
</section>

<footer>
  <p>&copy; 2024 Team Tap Games. All rights reserved.</p>
</footer>

<script src="js/app.js"></script>
<script>
  // Load and render blog posts from JSON
  async function loadBlogPosts() {
    try {
      const response = await fetch('data/blog-posts.json');
      
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const data = await response.json();
      const posts = data.posts;
      const container = document.getElementById('blogPostsContainer');
      
      if (!posts || posts.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666;">No blog posts available.</p>';
        return;
      }
      
      // Sort posts by date (newest first) - dates in format "Month Day, Year"
      posts.sort((a, b) => {
        // Parse dates like "January 15, 2024"
        const parseDate = (dateStr) => {
          // Convert "January 15, 2024" to a proper date
          return new Date(dateStr);
        };
        
        const dateA = parseDate(a.date);
        const dateB = parseDate(b.date);
        
        // Sort descending (newest first)
        return dateB - dateA;
      });
      
      // Render each post
      posts.forEach(post => {
        const article = document.createElement('article');
        article.className = 'blog-post';
        article.setAttribute('data-category', post.category);
        
        // Format category name for display
        const categoryDisplay = post.category.split('-').map(word => 
          word.charAt(0).toUpperCase() + word.slice(1)
        ).join(' ');
        
        // Build full content HTML
        const fullContentHTML = post.fullContent.map(paragraph => 
          `<p>${paragraph}</p>`
        ).join('');
        
        article.innerHTML = `
          <div class="blog-post-image">
            <img src="images/${post.image}" alt="${post.title}">
          </div>
          <div class="blog-post-content">
            <div class="blog-post-meta">
              <span class="blog-post-date"><i class="far fa-calendar"></i> ${post.date}</span>
              <span class="blog-post-category">${categoryDisplay}</span>
            </div>
            <h2>${post.title}</h2>
            <p class="blog-post-excerpt">${post.excerpt}</p>
            <div class="blog-post-full" style="display: none;">
              ${fullContentHTML}
            </div>
            <a href="#" class="blog-read-more" onclick="toggleBlogPost(this); return false;">Read More <i class="fas fa-arrow-right"></i></a>
          </div>
        `;
        
        container.appendChild(article);
      });
    } catch (error) {
      console.error('Error loading blog posts:', error);
      const container = document.getElementById('blogPostsContainer');
      if (container) {
        let errorMessage = '';
        if (error.message.includes('fetch') || error.name === 'TypeError' || error.message.includes('Failed to fetch')) {
          errorMessage = `
            <div style="text-align: center; padding: 40px; color: #666;">
              <p><strong>Error loading blog posts</strong></p>
              <p>Make sure you're accessing the site through a web server:</p>
              <p><code>http://localhost:8000/blog.html</code></p>
              <p>Not: <code>file:///path/to/blog.html</code></p>
              <p style="margin-top: 20px; font-size: 0.9em; color: #999;">
                Current URL: ${window.location.href}<br>
                Protocol: ${window.location.protocol}
              </p>
            </div>
          `;
        } else {
          errorMessage = `
            <div style="text-align: center; padding: 40px; color: #666;">
              <p><strong>Error loading blog posts</strong></p>
              <p>${error.message}</p>
              <p style="margin-top: 20px; font-size: 0.9em; color: #999;">
                Check the browser console for more details.
              </p>
            </div>
          `;
        }
        container.innerHTML = errorMessage;
      }
    }
  }

  // Blog filtering functionality
  function filterBlogPosts(category) {
    const posts = document.querySelectorAll('.blog-post');
    const filterButtons = document.querySelectorAll('.blog-filter-container .filter-btn');
    
    // Update active button
    filterButtons.forEach(btn => {
      if (btn.getAttribute('data-filter') === category) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
    
    // Filter posts
    posts.forEach(post => {
      if (category === 'all') {
        post.style.display = 'block';
      } else {
        const postCategory = post.getAttribute('data-category');
        if (postCategory === category) {
          post.style.display = 'block';
        } else {
          post.style.display = 'none';
        }
      }
    });
  }

  // Toggle blog post expand/collapse
  function toggleBlogPost(link) {
    const postContent = link.previousElementSibling;
    const blogPost = link.closest('.blog-post');
    const isExpanded = postContent.style.display !== 'none';
    
    if (isExpanded) {
      // Collapse
      postContent.style.display = 'none';
      link.innerHTML = 'Read More <i class="fas fa-arrow-right"></i>';
      link.classList.remove('expanded');
      blogPost.classList.remove('expanded');
    } else {
      // Expand
      postContent.style.display = 'block';
      link.innerHTML = 'Read Less <i class="fas fa-arrow-up"></i>';
      link.classList.add('expanded');
      blogPost.classList.add('expanded');
      
      // Smooth scroll to the link after expansion
      setTimeout(() => {
        link.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }, 100);
    }
  }

  // Check if running from file:// protocol and show warning
  if (window.location.protocol === 'file:') {
    const container = document.getElementById('blogPostsContainer');
    if (container) {
      container.innerHTML = `
        <div style="text-align: center; padding: 40px; background: #fff3cd; border: 2px solid #ffc107; border-radius: 10px; margin: 20px; color: #856404;">
          <h3 style="color: #856404; margin-bottom: 20px;">⚠️ Wrong Access Method</h3>
          <p><strong>You're opening this file directly (file:// protocol)</strong></p>
          <p>This won't work! You need to access it through the web server.</p>
          <div style="background: #fff; padding: 20px; border-radius: 5px; margin: 20px 0; font-family: monospace;">
            <p style="margin: 10px 0;"><strong>✅ Correct way:</strong></p>
            <p style="margin: 10px 0; color: #28a745;">http://localhost:8000/blog.html</p>
            <p style="margin: 10px 0;"><strong>❌ Wrong way:</strong></p>
            <p style="margin: 10px 0; color: #dc3545;">file:///Users/.../blog.html</p>
          </div>
          <p style="margin-top: 20px;">
            <strong>Steps:</strong><br>
            1. Make sure the server is running: <code>python3 -m http.server 8000</code><br>
            2. Open your browser<br>
            3. Go to: <a href="http://localhost:8000/blog.html" style="color: #007bff;">http://localhost:8000/blog.html</a>
          </p>
        </div>
      `;
    }
  } else {
    // Load posts when page loads (only if not file://)
    document.addEventListener('DOMContentLoaded', loadBlogPosts);
  }
</script>
</body>
</html>
